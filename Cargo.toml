[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/import", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
budgeterrr-core = { path = "crates/core" }
budgeterrr-storage = { path = "crates/storage" }
budgeterrr-import = { path = "crates/import" }
dioxus = { version = "0.7.10", features = ["desktop"] }
directories = "6.0.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
